<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>キリ番つなぎ連鎖（試作）</title>
<style>
  :root{ --bg:#0f1226; --accent:#5ad1ff; --good:#46e6a0; --bad:#ff6b8b; --gold:#ffd75e; --text:#eef1ff; --muted:#9aa0c9; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 120% at 50% 0%, #1a1f44 0%, var(--bg) 55%);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  .wrap{width:min(94vw,440px);display:flex;flex-direction:column;gap:12px;padding:12px 0 18px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;}
  .title{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--muted);}
  .stat{text-align:right;}
  .stat .label{font-size:10px;color:var(--muted);letter-spacing:.1em;}
  .stat .val{font-size:24px;font-weight:900;line-height:1;}

  .bar{display:flex;gap:8px;}
  .chip{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 6px;text-align:center;}
  .chip span{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;}
  .chip b{font-size:19px;font-weight:900;}
  .sumchip b{transition:color .12s;}
  .sumchip b.ok{color:var(--good);} .sumchip b.over{color:var(--bad);}

  .boardwrap{position:relative;width:100%;aspect-ratio:1/1;}
  .board{position:absolute;inset:0;display:grid;gap:7px;padding:7px;border-radius:20px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);touch-action:none;}
  .cell{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,6vw,30px);font-weight:800;color:#fff;
    background:linear-gradient(180deg,var(--c1,#3a4080),var(--c2,#2a2f5e));
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3);transition:transform .08s ease;}
  .cell[data-v="1"]{--c1:#e05c5c;--c2:#b03838;} .cell[data-v="2"]{--c1:#e07a30;--c2:#b05520;}
  .cell[data-v="3"]{--c1:#d4b428;--c2:#a08010;} .cell[data-v="4"]{--c1:#5cb85c;--c2:#3a8a3a;}
  .cell[data-v="5"]{--c1:#2ab8a0;--c2:#1a8870;} .cell[data-v="6"]{--c1:#3ab4e0;--c2:#2080b0;}
  .cell[data-v="7"]{--c1:#5a6ee0;--c2:#3848b0;} .cell[data-v="8"]{--c1:#9a50d0;--c2:#6a2ea0;}
  .cell[data-v="9"]{--c1:#d050a0;--c2:#a02878;}
  .cell.fall{animation:drop .3s cubic-bezier(.2,.9,.3,1.12) both;}
  @keyframes drop{from{transform:translateY(var(--from,-60%));opacity:0;}to{transform:translateY(0);opacity:1;}}
  .cell.sel{transform:scale(.86);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 0 16px rgba(90,209,255,.7);}
  .cell.sel.ok{box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 0 20px rgba(70,230,160,.9);}
  .cell.sel.over{box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 0 18px rgba(255,107,139,.8);}
  .cell.pop{animation:pop .22s ease forwards;}
  @keyframes pop{40%{transform:scale(1.12);}100%{transform:scale(0);opacity:0;}}
  svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}

  .controls{display:flex;gap:10px;}
  button{flex:1;font-family:inherit;font-weight:800;font-size:14px;color:var(--text);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;cursor:pointer;}
  button:active{transform:scale(.97);}
  .hint{text-align:center;font-size:12px;color:var(--muted);min-height:15px;}

  #combo{position:fixed;left:50%;top:34%;transform:translateX(-50%);text-align:center;
    font-weight:900;opacity:0;pointer-events:none;z-index:40;text-shadow:0 4px 18px rgba(0,0,0,.6);}
  #combo .n{font-size:64px;line-height:1;color:var(--gold);}
  #combo .t{font-size:22px;color:#fff;letter-spacing:.1em;}
  #combo.show{animation:combo .7s ease;}
  @keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.5);}30%{opacity:1;transform:translateX(-50%) scale(1.15);}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-26px);}}
  body.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translate(0,0);}25%{transform:translate(-5px,2px);}50%{transform:translate(4px,-3px);}75%{transform:translate(-3px,3px);}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">キリ番つなぎ連鎖（試作）</div>
      <div class="stat"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    </header>
    <div class="bar">
      <div class="chip"><span>つないだ合計</span><b id="sum" class="sumchip">0</b></div>
      <div class="chip"><span>さいだい連鎖</span><b id="best">0</b></div>
    </div>
    <div class="boardwrap">
      <div class="board" id="board"></div>
      <svg class="lines" id="lines" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline id="poly" fill="none" stroke="#5ad1ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
      </svg>
    </div>
    <div class="hint" id="hint">となりどうしをなぞって、合計を 10・20・30… のキリ番に！ 長いほど高得点＆連鎖</div>
    <div class="controls"><button id="shuffle">シャッフル</button></div>
  </div>
  <div id="combo"><div class="n" id="comboN">2</div><div class="t">れんさ！</div></div>

<script>
(() => {
  const N = 6, TARGET = 10;
  const boardEl = document.getElementById('board');
  const polyEl = document.getElementById('poly');
  const sumEl = document.getElementById('sum');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const hintEl = document.getElementById('hint');
  boardEl.style.gridTemplateColumns = `repeat(${N},1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${N},1fr)`;

  let grid = [], path = [], dragging = false, score = 0, best = 0, inputLocked = false;
  const rnd = n => Math.floor(Math.random()*n);
  const randVal = () => 1 + rnd(9);
  const wait = ms => new Promise(r=>setTimeout(r,ms));

  // ---- 効果音 ----
  const Snd = (()=>{ let ctx=null,master=null;
    function ac(){ if(!ctx){const A=window.AudioContext||window.webkitAudioContext; if(!A)return null; ctx=new A(); master=ctx.createGain(); master.gain.value=0.22; master.connect(ctx.destination);} if(ctx.state==='suspended')ctx.resume(); return ctx; }
    function tone(f,type,dur,g,slide){ if(!ac())return; const t=ctx.currentTime,o=ctx.createOscillator(),gn=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
      gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(g,t+0.005);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(gn).connect(master);o.start(t);o.stop(t+dur+0.02); }
    return { tick:n=>tone(300+Math.min(n,10)*32,'triangle',0.04,0.1),
             clear:c=>tone(440+Math.min(c,12)*110,'triangle',0.14,0.26,880+Math.min(c,12)*140),
             ensure:ac }; })();

  function newGrid(){ grid = Array.from({length:N},()=>Array.from({length:N},()=>randVal())); }

  function colorOf(v){ return v; }
  function render(motion){
    boardEl.innerHTML='';
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const v=grid[r][c]; const el=document.createElement('div');
      el.className='cell'; el.dataset.r=r; el.dataset.c=c;
      if(v==null){ el.style.visibility='hidden'; } else { el.textContent=v; el.dataset.v=v; }
      boardEl.appendChild(el);
    }
    if(motion){ const s=boardEl.querySelector('.cell'); const h=s?s.offsetHeight:50, gap=7;
      boardEl.querySelectorAll('.cell').forEach(el=>{ const m=motion[+el.dataset.r][+el.dataset.c];
        if(m>0){ el.style.setProperty('--from',`-${m*(h+gap)}px`); el.classList.add('fall'); } }); }
  }
  const cellEl=(r,c)=>boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  const pathSum=()=>path.reduce((s,p)=>s+grid[p.r][p.c],0);

  const isRound=s=>s>=TARGET && s%TARGET===0;   // 10,20,30… のキリ番
  function updateVisual(){
    const sum=pathSum(); sumEl.textContent=sum;
    const ok=isRound(sum)&&path.length>=2;
    sumEl.className='sumchip'+(ok?' ok':'');
    boardEl.querySelectorAll('.cell').forEach(el=>el.classList.remove('sel','ok','over'));
    path.forEach(p=>{const el=cellEl(p.r,p.c); if(el){el.classList.add('sel'); if(ok)el.classList.add('ok');}});
    if(path.length<1){polyEl.setAttribute('opacity','0');return;}
    const u=100/N; polyEl.setAttribute('points', path.map(p=>`${(p.c+0.5)*u},${(p.r+0.5)*u}`).join(' '));
    polyEl.setAttribute('opacity','0.9'); polyEl.setAttribute('stroke', ok?'#46e6a0':'#5ad1ff');
  }

  // ---- pointer ----
  function cellFromPoint(x,y){ const el=document.elementFromPoint(x,y); if(!el)return null;
    const c=el.closest('.cell'); if(!c||c.style.visibility==='hidden')return null; return {r:+c.dataset.r,c:+c.dataset.c}; }
  const adjacent=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
  const inPath=p=>path.some(q=>q.r===p.r&&q.c===p.c);

  function start(x,y){ if(inputLocked)return; const p=cellFromPoint(x,y); if(!p)return; dragging=true; path=[p]; Snd.tick(1); updateVisual(); }
  function move(x,y){ if(!dragging)return; const p=cellFromPoint(x,y); if(!p)return; const last=path[path.length-1];
    if(last.r===p.r&&last.c===p.c)return;
    if(path.length>=2){const prev=path[path.length-2]; if(prev.r===p.r&&prev.c===p.c){path.pop();updateVisual();return;}}
    if(inPath(p))return; if(!adjacent(last,p))return; path.push(p); Snd.tick(path.length); updateVisual(); }
  async function end(){ if(!dragging)return; dragging=false;
    const sum=pathSum();
    if(isRound(sum) && path.length>=2){ await doClear(); }
    else { path=[]; updateVisual(); } }

  // 自動連鎖：直線（縦横）で合計が「ちょうど10」になる連続並びを検出
  // （手動はキリ番=10の倍数でOKだが、自動連鎖は厳密10にして“たまに起きる特別”に保つ）
  function findStraightTens(){
    const mark=new Set();
    for(let r=0;r<N;r++)for(let c1=0;c1<N;c1++){ if(grid[r][c1]==null)continue; let s=0;
      for(let c2=c1;c2<N;c2++){ if(grid[r][c2]==null)break; s+=grid[r][c2];
        if(s===TARGET&&c2>c1){for(let k=c1;k<=c2;k++)mark.add(r+','+k);} if(s>=TARGET)break; } }
    for(let c=0;c<N;c++)for(let r1=0;r1<N;r1++){ if(grid[r1][c]==null)continue; let s=0;
      for(let r2=r1;r2<N;r2++){ if(grid[r2][c]==null)break; s+=grid[r2][c];
        if(s===TARGET&&r2>r1){for(let k=r1;k<=r2;k++)mark.add(k+','+c);} if(s>=TARGET)break; } }
    return mark;
  }

  function applyGravity(){
    const motion=Array.from({length:N},()=>Array(N).fill(0));
    for(let c=0;c<N;c++){ const surv=[];
      for(let r=N-1;r>=0;r--) if(grid[r][c]!=null) surv.push({row:r,val:grid[r][c]});
      const holes=N-surv.length;
      for(let r=N-1;r>=0;r--){ const idx=N-1-r;
        if(idx<surv.length){ grid[r][c]=surv[idx].val; motion[r][c]=r-surv[idx].row; }
        else { grid[r][c]=randVal(); motion[r][c]=holes; } } }
    return motion;
  }

  function showCombo(chain){
    const el=document.getElementById('combo'); document.getElementById('comboN').textContent=chain;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    if(chain>=3){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); }
  }

  async function clearCells(keys, chain){
    let valSum=0;
    keys.forEach(k=>{ const [r,c]=k.split(',').map(Number); valSum+=grid[r][c]; const el=cellEl(r,c); if(el)el.classList.add('pop'); grid[r][c]=null; });
    score += valSum*chain; scoreEl.textContent=score;   // 消した数字の合計 × 連鎖数
    Snd.clear(chain);
    await wait(200);
    const m=applyGravity(); render(m);
    await wait(230);
  }

  // 手動でキリ番を消す → 連鎖を解決
  async function doClear(){
    inputLocked=true;
    const keys=path.map(p=>p.r+','+p.c);
    path=[]; polyEl.setAttribute('opacity','0'); sumEl.textContent='0'; sumEl.className='sumchip';
    await clearCells(keys, 1);
    // 連鎖
    let chain=1;
    while(true){ const mark=findStraightTens(); if(mark.size===0)break; chain++;
      showCombo(chain);
      await clearCells([...mark], chain);
      if(chain>50)break; }
    if(chain>best){ best=chain; bestEl.textContent=best; }
    boardEl.querySelectorAll('.cell').forEach(el=>el.classList.remove('sel','ok','over'));
    inputLocked=false;
  }

  // 初期化：直線10が無い安定状態にしておく
  function stabilize(){ let guard=0; while(guard++<200){ const m=findStraightTens(); if(!m.size)break;
    m.forEach(k=>{const[r,c]=k.split(',').map(Number); grid[r][c]=null;}); applyGravity(); } }

  function reset(){ newGrid(); stabilize(); render(); path=[]; updateVisual(); }

  boardEl.addEventListener('pointerdown',e=>{e.preventDefault();Snd.ensure();start(e.clientX,e.clientY);});
  window.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();move(e.clientX,e.clientY);}},{passive:false});
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
  document.getElementById('shuffle').addEventListener('click',()=>{ if(inputLocked)return; reset(); });

  reset();
})();
</script>
</body>
</html>
